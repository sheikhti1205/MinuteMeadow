name: companion_focus
description: An Android focus timer with pixel-art companions.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  archive: 4.7.1
  crypto: ^3.0.7
  drift: 2.35.4
  drift_flutter: 0.3.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.5.0
  flutter_local_notifications: 22.2.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/companion/catalog.json
