name: Android integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-integration
  cancel-in-progress: false

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Prepare Android runner
        run: |
          flutter create --empty --no-pub --platforms=android --org=app.companionfocus --project-name=companion_focus .
          git show HEAD:pubspec.lock > pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - name: Allow Android emulator access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test -d emulator-5554
