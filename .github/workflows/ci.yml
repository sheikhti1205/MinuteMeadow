name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_development_tools:
        description: Include the Animation laboratory and geometric catalogue in the web artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}-${{ inputs.include_development_tools == true }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Prepare platform runners
        run: |
          flutter create --empty --no-pub --platforms=android,web --org=app.companionfocus --project-name=companion_focus .
          git show HEAD:pubspec.lock > pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Prepare SQLite for web
        run: |
          release=https://github.com/simolus3/drift/releases/download/drift-2.35.4
          curl --fail --location --silent --show-error "$release/sqlite3.wasm" --output web/sqlite3.wasm
          curl --fail --location --silent --show-error "$release/drift_worker.js" --output web/drift_worker.js
          (cd web; sha256sum --check <<'CHECKSUMS'
          e7451780e78c56ff864fe9317a0fbcd6aeb2e8de3beba7f5efd963202f7ec3d9  sqlite3.wasm
          48c950cd8e3bc3cddb34816c860e228be8832bef07a297c27e9907c057ff8162  drift_worker.js
          CHECKSUMS
          )
      - name: Build the web app
        env:
          INCLUDE_DEVELOPMENT_TOOLS: ${{ inputs.include_development_tools == true }}
        run: |
          flutter build web --no-web-resources-cdn \
            --dart-define=COMPANION_FOCUS_DEVELOPMENT_TOOLS="$INCLUDE_DEVELOPMENT_TOOLS"
      - name: Retain the web build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-focus-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7
      - run: flutter build apk --debug
      - name: Retain the Android debug build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-focus-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
