name: Flutter CI

run-name: "MinuteMeadow CI - run ${{ github.run_number }}.${{ github.run_attempt }} - ${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_web:
        description: Build and retain the web app
        type: boolean
        default: false
      build_android:
        description: Build the Android debug APK
        type: boolean
        default: false
      build_android_signed:
        description: Build, sign and retain the Android release APK through the android-signing environment
        type: boolean
        default: false
      include_development_tools:
        description: Include the Animation laboratory and geometric catalogue in the web artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_web }}-${{ inputs.build_android }}-${{ inputs.build_android_signed }}-${{ inputs.include_development_tools }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      version_id: ${{ steps.version.outputs.version_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve the shared build version
        id: version
        env:
          ANDROID_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && (inputs.build_android || inputs.build_android_signed) }}
        run: python3 tool/ci_version.py
      - name: Test the build version calculator
        run: python3 tool/test_ci_version.py
      - name: Refuse a signed build outside main
        if: github.event_name == 'workflow_dispatch' && inputs.build_android_signed && github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Signed builds only run from main::This run targets ${GITHUB_REF}. Dispatch the signed build from the latest main commit."
          exit 1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Prepare platform runners
        run: |
          flutter create --empty --no-pub --platforms=android,web --org=app.companionfocus --project-name=companion_focus .
          git show HEAD:pubspec.lock > pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Verify the Android build is from current main
        if: github.event_name == 'workflow_dispatch' && (inputs.build_android || inputs.build_android_signed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error title=Stale Android build::main is at ${latest_main}, but this run targets ${GITHUB_SHA}. To build this SHA, dispatch a new Android build from the latest main commit so the version code cannot move backwards."
            exit 1
          fi
      - name: Prepare SQLite for web
        if: github.event_name == 'workflow_dispatch' && (inputs.build_web || inputs.include_development_tools)
        run: |
          release=https://github.com/simolus3/drift/releases/download/drift-2.35.4
          curl --fail --location --silent --show-error "$release/sqlite3.wasm" --output web/sqlite3.wasm
          curl --fail --location --silent --show-error "$release/drift_worker.js" --output web/drift_worker.js
          (cd web; sha256sum --check <<'CHECKSUMS'
          e7451780e78c56ff864fe9317a0fbcd6aeb2e8de3beba7f5efd963202f7ec3d9  sqlite3.wasm
          48c950cd8e3bc3cddb34816c860e228be8832bef07a297c27e9907c057ff8162  drift_worker.js
          CHECKSUMS
          )
      - name: Build the web app
        if: github.event_name == 'workflow_dispatch' && (inputs.build_web || inputs.include_development_tools)
        env:
          INCLUDE_DEVELOPMENT_TOOLS: ${{ inputs.include_development_tools == true }}
        run: |
          flutter build web --no-web-resources-cdn \
            --dart-define=COMPANION_FOCUS_DEVELOPMENT_TOOLS="$INCLUDE_DEVELOPMENT_TOOLS" \
            --dart-define=APP_VERSION="$VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$VERSION_CODE" \
            --dart-define=APP_BUILD_ID="$VERSION_ID"
      - name: Retain the web build
        if: github.event_name == 'workflow_dispatch' && (inputs.build_web || inputs.include_development_tools)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-focus-web
          path: build/web/
          if-no-files-found: error
          retention-days: 1
      - name: Build the Android debug APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_android
        run: |
          flutter build apk --debug \
            --build-name="$VERSION_ID" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$VERSION_CODE" \
            --dart-define=APP_BUILD_ID="$VERSION_ID"
      - name: Retain the Android debug build
        if: github.event_name == 'workflow_dispatch' && inputs.build_android && github.event.repository.private == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-focus-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  android_signed:
    name: Android signed release
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.build_android_signed &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - name: Prepare the Android runner
        run: |
          flutter create --empty --no-pub --platforms=android --org=app.companionfocus --project-name=companion_focus .
          git show HEAD:pubspec.lock > pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - name: Verify the signed build targets current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error title=Stale signed build::main is at ${latest_main}, but this run targets ${GITHUB_SHA}. Dispatch a new signed build from the latest main commit."
            exit 1
          fi
      - name: Build the unsigned release APK
        env:
          VERSION_NAME: ${{ needs.validate.outputs.version }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          VERSION_ID: ${{ needs.validate.outputs.version_id }}
        run: |
          flutter build apk --release \
            --build-name="$VERSION_ID" \
            --build-number="$VERSION_CODE" \
            --dart-define=APP_VERSION="$VERSION_NAME" \
            --dart-define=APP_BUILD_NUMBER="$VERSION_CODE" \
            --dart-define=APP_BUILD_ID="$VERSION_ID"
      - name: Sign and verify the release APK
        id: sign
        env:
          MINUTEMEADOW_ANDROID_KEYSTORE_B64: ${{ secrets.MINUTEMEADOW_ANDROID_KEYSTORE_B64 }}
          MINUTEMEADOW_ANDROID_STORE_PASSWORD: ${{ secrets.MINUTEMEADOW_ANDROID_STORE_PASSWORD }}
          MINUTEMEADOW_ANDROID_CERT_SHA256: ${{ vars.MINUTEMEADOW_ANDROID_CERT_SHA256 }}
          EXPECTED_PACKAGE: app.companionfocus.companion_focus
          EXPECTED_VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ needs.validate.outputs.version_id }}
        run: bash tool/sign_android_release.sh
      - name: Report the signed build
        env:
          VERSION_ID: ${{ needs.validate.outputs.version_id }}
          VERSION_CODE: ${{ needs.validate.outputs.version_code }}
          APK_SHA256: ${{ steps.sign.outputs.apk_sha256 }}
        run: |
          {
            echo "### Signed Android APK"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`app.companionfocus.companion_focus\` |"
            echo "| Version | \`${VERSION_ID}\` |"
            echo "| Version code | \`${VERSION_CODE}\` |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
            echo "| Retention | 1 day |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the signed release build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: companion-focus-android-signed
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
